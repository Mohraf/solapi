[supervisord]
logfile=/var/log/supervisor/supervisord.log ; main log file
logfile_maxbytes=50MB                        ; maximum size of the log file
logfile_backups=10                           ; number of backups to keep
loglevel=info                                ; log level
pidfile=/var/run/supervisord.pid             ; PID file location
nodaemon=false                               ; run in the foreground (set to true for debugging)

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=8
redirect_stderr=true
stdout_logfile=/var/www/worker.log
stopwaitsecs=3600
